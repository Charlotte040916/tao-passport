services:
  postgres:
    image: postgres:16-alpine
    container_name: tao-passport-postgres
    environment:
      POSTGRES_DB: tao_passport
      POSTGRES_USER: tao_passport
      POSTGRES_PASSWORD: tao_passport
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tao_passport -d tao_passport"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
